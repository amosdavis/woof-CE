# /etc/sysctl.d/99-puppy-hardening.conf
# Comprehensive kernel security hardening for Puppy Linux
# Addresses: ASLR, stack protection, ptrace, dmesg, core dumps,
# IP forwarding, ICMP attacks, SYN floods, source routing,
# Spectre/Meltdown side-channels, information disclosure

#=== Memory & Process Security ===

# Full Address Space Layout Randomization
kernel.randomize_va_space = 2

# Restrict ptrace to parent processes only (prevents process injection)
kernel.yama.ptrace_scope = 1

# Restrict kernel address exposure
kernel.kptr_restrict = 2

# Restrict dmesg to root only (prevents information disclosure)
kernel.dmesg_restrict = 1

# Prevent SUID processes from creating core dumps (data leak prevention)
fs.suid_dumpable = 0

# Protect hardlinks and symlinks (prevent symlink/hardlink attacks)
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

# Protect FIFOs and regular files in world-writable directories
fs.protected_fifos = 2
fs.protected_regular = 2

# Restrict unprivileged user namespaces (reduces attack surface)
# kernel.unprivileged_userns_clone = 0

# Restrict BPF to root (prevents BPF-based attacks)
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Disable kexec (prevents loading alternate kernels)
kernel.kexec_load_disabled = 1

# Performance events restrict to root
kernel.perf_event_paranoid = 3

#=== Network Security - IPv4 ===

# Disable IP forwarding (prevents routing attacks)
net.ipv4.ip_forward = 0

# Enable SYN cookies (SYN flood protection)
net.ipv4.tcp_syncookies = 1

# Disable source routing (prevents spoofing attacks)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Disable ICMP redirects (prevents MITM routing attacks)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Enable reverse path filtering (source address validation / anti-spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Log martian packets (impossible source addresses)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore ICMP broadcasts (prevents Smurf attacks)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# TCP timestamps (prevents time-based attacks, enables PAWS)
net.ipv4.tcp_timestamps = 1

# Randomize source port range
net.ipv4.ip_local_port_range = 32768 60999

# Disable TCP SACK when not needed (reduces attack surface)
# net.ipv4.tcp_sack = 0

# Harden TCP against connection hijacking
net.ipv4.tcp_rfc1337 = 1

#=== Network Security - IPv6 ===

# Disable IPv6 source routing
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Disable IPv6 redirects
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Disable IPv6 router advertisements (unless needed)
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Disable IPv6 forwarding
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.default.forwarding = 0

#=== Filesystem Security ===

# Restrict core dumps
# (Also handled by limits.conf)
kernel.core_pattern = |/bin/false

# Protect /proc
# proc hidepid handled at mount time

#=== Virtual Memory ===

# Reduce swappiness for better responsiveness
vm.swappiness = 10

# Prevent OOM killer from killing important tasks too aggressively
vm.oom_kill_allocating_task = 1

# Dirty page writeback tuning for reliability
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Memory overcommit - moderate (prevents fork bombs from trivially succeeding)
vm.overcommit_memory = 0
vm.overcommit_ratio = 50
