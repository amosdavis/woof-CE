# /etc/security/limits.d/99-puppy-hardening.conf
# Resource limits to prevent resource exhaustion, fork bombs, core dump leaks
# Addresses: resource exhaustion, core dump data leaks, process limits

# Prevent core dumps (sensitive data leak prevention)
*               hard    core            0

# Limit number of processes per user (fork bomb protection)
*               soft    nproc           1024
*               hard    nproc           2048

# Limit open files per user
*               soft    nofile          4096
*               hard    nofile          8192

# Limit max locked memory (prevents memory exhaustion attacks)
*               hard    memlock         65536

# Root gets higher limits for system administration
root            soft    nproc           4096
root            hard    nproc           8192
root            soft    nofile          8192
root            hard    nofile          16384
