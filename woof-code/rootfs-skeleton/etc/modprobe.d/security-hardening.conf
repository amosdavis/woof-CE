# /etc/modprobe.d/security-hardening.conf
# Kernel module security hardening for Puppy Linux
# Addresses: unnecessary kernel modules, attack surface reduction,
# USB attacks, FireWire DMA attacks, Bluetooth vulnerabilities

# Disable uncommon and potentially dangerous network protocols
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false

# Disable uncommon filesystems (reduce attack surface)
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
install squashfs_do_not_blacklist_needed_by_puppy true
install udf /bin/false

# Disable FireWire DMA (prevents DMA attacks via FireWire/Thunderbolt)
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
install ohci1394 /bin/false
install sbp2 /bin/false
install dv1394 /bin/false
install raw1394 /bin/false
install video1394 /bin/false

# Disable Thunderbolt if not needed (DMA attack vector)
# install thunderbolt /bin/false

# Restrict USB storage autoload (can be re-enabled by user)
# install usb-storage /sbin/modprobe --ignore-install usb-storage

# Disable uncommon network filesystems
install cifs /bin/true
install nfs /bin/true
install nfsd /bin/true
install gfs2 /bin/false
