<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Puppy Linux D-Bus security hardening policy.
  Restricts system bus access to prevent privilege escalation
  and unauthorized service activation.
-->
<busconfig>
  <!-- Default: deny everything, then allow specific things -->
  <policy context="default">
    <!-- Allow basic connectivity -->
    <allow send_type="signal"/>
    <allow send_type="method_call"/>
    <allow send_type="method_return"/>
    <allow send_type="error"/>

    <!-- Deny ownership of system service names by non-root users -->
    <deny own="*"/>

    <!-- Deny sending to restricted interfaces unless explicitly allowed -->
    <deny send_destination="org.freedesktop.systemd1"/>
    <deny send_destination="org.freedesktop.login1" send_interface="org.freedesktop.login1.Manager" send_member="SetRebootToBootLoaderEntry"/>
  </policy>

  <!-- Root can do everything -->
  <policy user="root">
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>

  <!-- spot user: allow audio/display/network operations -->
  <policy user="spot">
    <allow send_destination="org.freedesktop.DBus"/>
    <allow send_destination="org.freedesktop.Notifications"/>
    <allow send_destination="org.freedesktop.NetworkManager"/>
    <allow send_destination="org.freedesktop.UDisks2"/>
    <allow send_destination="org.freedesktop.PolicyKit1"/>
    <allow send_destination="org.bluez"/>
    <allow send_destination="org.freedesktop.Avahi"/>
    <allow send_destination="fi.w1.wpa_supplicant1"/>

    <!-- Deny modifying system state -->
    <deny send_destination="org.freedesktop.systemd1"/>
    <deny send_destination="org.freedesktop.hostname1"/>
    <deny send_destination="org.freedesktop.locale1"/>
    <deny send_destination="org.freedesktop.timedate1"/>
  </policy>

  <!-- Rate limit connections to prevent DoS -->
  <limit name="max_completed_connections">512</limit>
  <limit name="max_incomplete_connections">64</limit>
  <limit name="max_connections_per_user">256</limit>
  <limit name="max_pending_service_starts">16</limit>
  <limit name="max_names_per_connection">256</limit>
  <limit name="max_match_rules_per_connection">512</limit>
  <limit name="max_replies_per_connection">2048</limit>
  <limit name="reply_timeout">25000</limit>
</busconfig>
