# /etc/pipewire/media-session.d/bluez-monitor.conf
# PipeWire Bluetooth codec configuration for Puppy Linux
# Addresses: Bluetooth audio codec regressions (Win 11, Linux)

[Properties]
bluez5.codecs = [ sbc sbc_xq aac ldac aptx aptx_hd aptx_ll ]
bluez5.default.rate = 48000
bluez5.default.channels = 2
bluez5.enable-hw-volume = true
bluez5.auto-connect = [ hfp_hf hsp_hs a2dp_sink a2dp_source ]
bluez5.enable-sbc-xq = true
bluez5.enable-msbc = true
bluez5.headset-roles = [ hfp_hf hsp_hs ]
