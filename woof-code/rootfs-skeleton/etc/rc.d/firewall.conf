# /etc/rc.d/firewall.conf - Puppy Linux Firewall Configuration
# This file is sourced by /etc/rc.d/rc.firewall
# Edit these settings to customize firewall behavior

# Allow incoming ICMP ping requests (yes/no)
ALLOW_PING=yes

# Log dropped packets to syslog (yes/no)
LOG_DROPPED=yes

# Allow incoming SSH connections (yes/no)
ALLOW_SSH=no

# Enable IPv6 firewall rules (yes/no)
# If set to 'no', all IPv6 traffic is dropped
ENABLE_IPV6=yes

# Space-separated list of additional TCP ports to allow inbound
# Example: ALLOWED_TCP_IN="80 443 8080"
ALLOWED_TCP_IN=

# Space-separated list of additional UDP ports to allow inbound
# Example: ALLOWED_UDP_IN="53"
ALLOWED_UDP_IN=
