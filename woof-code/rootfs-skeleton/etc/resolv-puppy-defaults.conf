# /etc/resolv-puppy-defaults.conf
# Secure DNS resolver defaults for Puppy Linux
# Addresses: DNS vulnerabilities, cache poisoning, privacy
# This file is used as template by network scripts

# Use localhost resolver first if available (dnscrypt/stubby)
# Then fall back to privacy-respecting public DNS
# nameserver 127.0.0.1
# nameserver 9.9.9.9
# nameserver 149.112.112.112

# Limit DNS query retries (prevents amplification in attacks)
options timeout:5 attempts:2

# Rotate between nameservers for load distribution
options rotate

# Use TCP for DNS queries when UDP fails (more reliable)
options use-vc

# Restrict search domains to prevent domain hijacking
# search local
