name: ubuntu-jammy64

on:
  schedule:
    - cron: '0 0 2 * *'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      repo: ${{ github.repository }}
      ref: ${{ github.ref }}
      arch: x86_64
      compat-distro: ubuntu
      compat-distro-version: jammy64
      kernel: ubuntu-jammy
      artifact: ${{ github.workflow }}-${{ github.run_number }}
      retention: 31
      runner: 'ubuntu-22.04'
